services:
  connector:
    build:
      context: ./connector
      dockerfile: Dockerfile
    init: true
    environment:
      PORT: "3101"
      SNAPCHAT_SHARED_SECRET: "${SNAPCHAT_SHARED_SECRET:-change-me}"
      SNAPCHAT_PROFILE_DIR: "/data/snapchat-profile"
      SNAPCHAT_TRACE_DIR: "/data/debug"
      SNAPCHAT_HEADLESS: "${SNAPCHAT_HEADLESS:-false}"
      SNAPCHAT_DEFAULT_TIMEOUT_MS: "${SNAPCHAT_DEFAULT_TIMEOUT_MS:-30000}"
      SNAPCHAT_NAVIGATION_TIMEOUT_MS: "${SNAPCHAT_NAVIGATION_TIMEOUT_MS:-45000}"
      SNAPCHAT_MESSAGE_ATTEMPTS: "${SNAPCHAT_MESSAGE_ATTEMPTS:-2}"
      SNAPCHAT_SAFE_NO_OPEN: "${SNAPCHAT_SAFE_NO_OPEN:-1}"
    ports:
      - "127.0.0.1:3101:3101"
      - "127.0.0.1:6080:6080"
    shm_size: "512mb"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/healthz', { headers: { 'X-Bridge-Secret': process.env.SNAPCHAT_SHARED_SECRET || '' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridgev2
    depends_on:
      connector:
        condition: service_healthy
    command: ["-c", "/config/bridgev2-config.yaml"]
    ports:
      - "127.0.0.1:29344:4000"
    volumes:
      - ./data:/data
      - ./docker:/config
    restart: unless-stopped
